name: Build and Publish NuGet Packages

on:
  push:
    branches:
      - main
  release:
    types: [published]

env:
  DOTNET_VERSION: '10.0.x'
  NUGET_SOURCE: 'https://nuget.pkg.github.com/techierathore/index.json'

jobs:
  build-and-publish:
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for version context

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify .NET SDK
        run: dotnet --version

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
            # Strip optional 'v' prefix
            $ver = $tag -replace '^v', ''
            Write-Host "Release tag: $tag -> version: $ver"
          } else {
            # Read base version from Directory.Build.props
            [xml]$props = Get-Content "Directory.Build.props"
            $base = $props.Project.PropertyGroup.Version
            $ver = "$base-ci.${{ github.run_number }}"
            Write-Host "CI build: base=$base -> version: $ver"
          }

          # Validate semver format (with optional pre-release)
          if ($ver -notmatch '^\d+\.\d+\.\d+(-[a-zA-Z0-9]+(\.[a-zA-Z0-9]+)*)?$') {
            throw "Invalid semver version: $ver"
          }

          Write-Host "PACKAGE_VERSION=$ver"
          echo "PACKAGE_VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Add GitHub Packages source
        shell: pwsh
        run: |
          # 'remove source' exits 1 when the source is absent. Under GitHub's pwsh
          # ($ErrorActionPreference='stop' + PS 7.4 PSNativeCommandUseErrorActionPreference)
          # that non-zero exit aborts the step, so opt out around the tolerated call.
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet nuget remove source TrBlazeUI 2>&1 | Out-Null
          dotnet nuget add source ${{ env.NUGET_SOURCE }} --name TrBlazeUI --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text
          if ($LASTEXITCODE -ne 0) { throw "dotnet nuget add source failed with exit code $LASTEXITCODE" }

      - name: Restore dependencies
        run: dotnet restore TrBlazeUI.sln

      - name: Build solution
        run: dotnet build TrBlazeUI.sln -c Release --no-restore -p:CI=true -p:Version=${{ steps.version.outputs.PACKAGE_VERSION }}

      - name: Pack NuGet packages
        shell: pwsh
        run: |
          $projects = @(
            "src/TrBlazeUI.Primitives/TrBlazeUI.Primitives.csproj",
            "src/TrBlazeUI.Components/TrBlazeUI.Components.csproj",
            "src/TrBlazeUI.Icons.Lucide/TrBlazeUI.Icons.Lucide.csproj",
            "src/TrBlazeUI.Icons.Heroicons/TrBlazeUI.Icons.Heroicons.csproj",
            "src/TrBlazeUI.Icons.Feather/TrBlazeUI.Icons.Feather.csproj"
          )
          foreach ($project in $projects) {
            Write-Host "Packing $project..."
            dotnet pack $project -c Release --no-restore -o ./nupkgs -p:CI=true -p:Version=${{ steps.version.outputs.PACKAGE_VERSION }}
            if ($LASTEXITCODE -ne 0) { throw "dotnet pack failed for $project with exit code $LASTEXITCODE" }
          }

      - name: List generated packages
        shell: pwsh
        run: |
          $packages = Get-ChildItem ./nupkgs -Filter *.nupkg -ErrorAction SilentlyContinue
          if (-not $packages -or $packages.Count -eq 0) {
            throw "No .nupkg files found in ./nupkgs - pack step likely failed"
          }
          Write-Host "Generated $($packages.Count) packages:"
          foreach ($pkg in $packages) {
            Write-Host "  $($pkg.Name) ($($pkg.Length) bytes)"
          }

      - name: Verify package versions
        shell: pwsh
        run: |
          $expectedVersion = "${{ steps.version.outputs.PACKAGE_VERSION }}"
          $packages = Get-ChildItem ./nupkgs -Filter *.nupkg
          $mismatched = @()
          foreach ($pkg in $packages) {
            if ($pkg.Name -notlike "*$expectedVersion*") {
              $mismatched += $pkg.Name
            }
          }
          if ($mismatched.Count -gt 0) {
            Write-Host "ERROR: Package version mismatch! Expected version: $expectedVersion"
            foreach ($m in $mismatched) {
              Write-Host "  Mismatched: $m"
            }
            throw "Package version verification failed"
          }
          Write-Host "All $($packages.Count) packages contain expected version: $expectedVersion"

      - name: Publish to GitHub Packages
        shell: pwsh
        run: |
          $packages = Get-ChildItem ./nupkgs -Filter *.nupkg
          foreach ($pkg in $packages) {
            Write-Host "Pushing $($pkg.Name)..."
            dotnet nuget push $pkg.FullName --source TrBlazeUI --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Failed to push $($pkg.Name) with exit code $LASTEXITCODE" }
          }
