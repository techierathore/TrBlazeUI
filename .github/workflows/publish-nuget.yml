name: Build and Publish NuGet Packages

on:
  push:
    branches:
      - master
  release:
    types: [published]

env:
  DOTNET_VERSION: '10.0.x'
  NUGET_SOURCE: 'https://nuget.pkg.github.com/techierathore/index.json'

jobs:
  build-and-publish:
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for MinVer

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify .NET SDK
        run: dotnet --version

      - name: Add GitHub Packages source
        run: |
          dotnet nuget remove source TrBlazeUI 2>$null
          dotnet nuget add source ${{ env.NUGET_SOURCE }} --name TrBlazeUI --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text

      - name: Restore dependencies
        run: dotnet restore TrBlazeUI.sln

      - name: Build solution
        run: dotnet build TrBlazeUI.sln -c Release --no-restore -p:CI=true

      - name: Pack NuGet packages
        run: |
          dotnet pack src/TrBlazeUI.Primitives/TrBlazeUI.Primitives.csproj -c Release --no-build -o ./nupkgs
          dotnet pack src/TrBlazeUI.Components/TrBlazeUI.Components.csproj -c Release --no-build -o ./nupkgs
          dotnet pack src/TrBlazeUI.Icons.Lucide/TrBlazeUI.Icons.Lucide.csproj -c Release --no-build -o ./nupkgs
          dotnet pack src/TrBlazeUI.Icons.Heroicons/TrBlazeUI.Icons.Heroicons.csproj -c Release --no-build -o ./nupkgs
          dotnet pack src/TrBlazeUI.Icons.Feather/TrBlazeUI.Icons.Feather.csproj -c Release --no-build -o ./nupkgs

      - name: List generated packages
        run: |
          Write-Host "Generated packages:"
          Get-ChildItem ./nupkgs -Recurse | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }

      - name: Publish to GitHub Packages
        run: dotnet nuget push ./nupkgs/*.nupkg --source TrBlazeUI --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
