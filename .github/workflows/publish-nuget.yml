name: Publish to NuGet.org

# On-demand public release to nuget.org via NuGet Trusted Publishing (OIDC).
# No API key is stored anywhere: the trusted publishing policy on nuget.org is bound to this
# repository AND this workflow file path (.github/workflows/publish-nuget.yml). Renaming or
# moving this file invalidates the policy until it is updated on nuget.org.
#
# The private GitHub Packages feed is published by publish-github-packages.yml and is entirely
# independent of this workflow. See NUGET-PUBLISHING.md for the full procedure.

# The run title states the outcome up front, because a dry run and a real publish otherwise look
# identical in the Actions list: both are a green tick. That ambiguity cost a release cycle on
# 2026-08-31 - a dry run succeeded and was reasonably read as "published", while nuget.org sat
# unchanged at 2.0.0 from 8/9/2026.
run-name: >-
  ${{ startsWith(inputs.mode, 'publish') && 'PUBLISH to nuget.org' || 'DRY RUN (nothing published)' }}
  - ref ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag or SHA) to build and publish'
        required: true
        default: 'main'
      mode:
        # A `choice` renders as a REQUIRED DROPDOWN with both outcomes spelled out. This replaced a
        # `type: boolean` on 2026-08-31: a checkbox defaulting to "on" is easy to overlook, gives no
        # hint that leaving it alone means "publish nothing", and - critically - the "Re-run jobs"
        # button never shows the input form at all, so a re-run silently repeats the previous
        # choice. A run then succeeds, publishes nothing, and looks exactly like a release.
        description: 'What to do'
        type: choice
        required: true
        default: 'dry-run  (build and verify only - publishes NOTHING)'
        options:
          - 'dry-run  (build and verify only - publishes NOTHING)'
          - 'publish  (push all five packages to nuget.org)'

env:
  DOTNET_VERSION: '10.0.x'
  NUGET_ORG_SOURCE: 'https://api.nuget.org/v3/index.json'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      # id-token: write is what makes Trusted Publishing possible - it lets the job mint the
      # short-lived OIDC token that NuGet/login exchanges for a temporary API key.
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0  # Full history so SourceLink records an accurate commit

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Report inputs
        shell: pwsh
        run: |
          Write-Host "ref      : ${{ inputs.ref }}"
          Write-Host "mode     : ${{ inputs.mode }}"
          Write-Host "sha      : ${{ github.sha }}"
          dotnet --version

      - name: Resolve shared package version
        id: version
        shell: pwsh
        run: |
          # THE RELEASE TAG IS THE VERSION. Fixed 2026-08-31.
          #
          # This step used to read <Version> from Directory.Build.props and stated that it
          # "deliberately does NOT synthesise or override a version". That was the bug: props
          # carries the LOCAL-BUILD FALLBACK, it is not bumped as part of ordinary work, and the
          # value there had gone stale - so every public release shipped whatever number happened
          # to be committed rather than the version actually being released. nuget.org sat on
          # 2.0.0 through two release cycles because of it. publish-github-packages.yml already
          # resolved from the tag; this workflow now matches it.
          #
          # Resolution order (first hit wins):
          #   1. release event      -> github.event.release.tag_name
          #   2. inputs.ref is a version tag (v2.1.1 / 2.1.1 / 2.1.1-beta.1)
          #   3. nearest tag reachable from the checked-out ref (git describe)
          #   4. Directory.Build.props  -- FALLBACK ONLY, and it BLOCKS a real push (see below)
          $ver = $null
          $source = $null
          $fromTag = $false

          $releaseTag = "${{ github.event.release.tag_name }}"
          $inputRef   = "${{ inputs.ref }}"

          if (-not [string]::IsNullOrWhiteSpace($releaseTag)) {
            $ver = $releaseTag; $source = "release event tag '$releaseTag'"; $fromTag = $true
          }
          elseif ($inputRef -match '^v?\d+\.\d+(\.\d+)?(-[a-zA-Z0-9]+(\.[a-zA-Z0-9]+)*)?$') {
            $ver = $inputRef; $source = "workflow ref '$inputRef' (a version tag)"; $fromTag = $true
          }
          else {
            # The ref is a branch or a SHA. Use the newest release tag reachable from it - that is
            # "the release tag of the branch selected for the pipeline".
            $described = (git describe --tags --abbrev=0 2>$null)
            if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($described)) {
              $ver = $described.Trim()
              $source = "nearest tag reachable from '$inputRef' ($ver)"
              $fromTag = $true
            }
          }

          if (-not $fromTag) {
            [xml]$props = Get-Content "Directory.Build.props"
            $ver = ($props.Project.PropertyGroup.Version | Where-Object { $_ }) -as [string]
            $source = "Directory.Build.props FALLBACK (no release tag found)"
            Write-Host "::warning::No release tag could be resolved for ref '$inputRef'. Falling back to Directory.Build.props, which is the local-build fallback and is NOT a release version."
          }

          if ([string]::IsNullOrWhiteSpace($ver)) {
            throw "Could not resolve a package version from a release tag, the workflow ref, or Directory.Build.props."
          }

          $ver = $ver.Trim() -replace '^v', ''
          # Normalise a two-part tag (v2.1 -> 2.1.0); NuGet requires three parts.
          if ($ver -match '^\d+\.\d+$') {
            Write-Host "Tag has only two version parts; normalising to '$ver.0'"
            $ver = "$ver.0"
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+(-[a-zA-Z0-9]+(\.[a-zA-Z0-9]+)*)?$') {
            throw "Invalid semver version '$ver' (from $source). Expected MAJOR.MINOR.PATCH with an optional pre-release suffix, e.g. 2.1.1 or v2.1.1-beta.1"
          }

          Write-Host "Publishing version: $ver   (source: $source)"
          echo "PACKAGE_VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "VERSION_FROM_TAG=$($fromTag.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          echo "VERSION_SOURCE=$source" >> $env:GITHUB_OUTPUT

      - name: Refuse to publish a non-tag version
        if: ${{ startsWith(inputs.mode, 'publish') && steps.version.outputs.VERSION_FROM_TAG != 'true' }}
        shell: pwsh
        run: |
          # A real push must be traceable to a release tag. Falling back to the committed
          # Directory.Build.props value is exactly how nuget.org got stuck on 2.0.0, so a
          # non-dry-run publish without a tag is stopped here rather than shipped.
          throw "Refusing to push to nuget.org: version came from $($env:SRC) instead of a release tag. Create the release/tag first, then re-run this workflow with that tag as the ref. (A dry-run is still allowed without a tag.)"
        env:
          SRC: ${{ steps.version.outputs.VERSION_SOURCE }}

      - name: Restore dependencies
        run: dotnet restore TrBlazeUI.sln

      - name: Build solution
        run: dotnet build TrBlazeUI.sln -c Release --no-restore -p:CI=true -p:Version=${{ steps.version.outputs.PACKAGE_VERSION }}

      - name: Run tests
        shell: pwsh
        run: |
          # The repo currently has no test projects. Rather than hard-coding a no-op, discover
          # them: the step starts running real tests automatically once any are added.
          $testProjects = Get-ChildItem -Path tests -Recurse -Filter *.csproj -ErrorAction SilentlyContinue
          if (-not $testProjects -or $testProjects.Count -eq 0) {
            Write-Host "No test projects found under tests/ - skipping."
            exit 0
          }
          foreach ($proj in $testProjects) {
            Write-Host "Testing $($proj.FullName)..."
            dotnet test $proj.FullName -c Release --no-build
            if ($LASTEXITCODE -ne 0) { throw "Tests failed for $($proj.Name)" }
          }

      - name: Pack all five packages
        shell: pwsh
        run: |
          if (Test-Path ./nupkgs) { Remove-Item ./nupkgs -Recurse -Force }
          New-Item -ItemType Directory -Path ./nupkgs | Out-Null

          # NoWarn is applied per project, NOT as a blanket -p:NoWarn: an MSBuild global property
          # overrides project-level <NoWarn>, which would silently strip Primitives' CA1716
          # suppression and fail that pack instead.
          #
          # Components needs NU5104 ("a stable release should not have a prerelease dependency"):
          # its HtmlSanitizer 9.1.949-beta pin is a deliberate security choice (CVE-2026-54570 /
          # REQ-NFR-003). Public stable releases always trip this. Drop once stable 9.1.x ships.
          $projects = @(
            @{ Path = "src/TrBlazeUI.Primitives/TrBlazeUI.Primitives.csproj" },
            @{ Path = "src/TrBlazeUI.Icons.Lucide/TrBlazeUI.Icons.Lucide.csproj" },
            @{ Path = "src/TrBlazeUI.Icons.Heroicons/TrBlazeUI.Icons.Heroicons.csproj" },
            @{ Path = "src/TrBlazeUI.Icons.Feather/TrBlazeUI.Icons.Feather.csproj" },
            @{ Path = "src/TrBlazeUI.Components/TrBlazeUI.Components.csproj"; NoWarn = "NU5104" }
          )
          foreach ($project in $projects) {
            Write-Host "Packing $($project.Path)..."
            $extraArgs = @()
            if ($project.NoWarn) { $extraArgs += "-p:NoWarn=$($project.NoWarn)" }
            # -p:Version is REQUIRED here. Without it dotnet pack falls back to the committed
            # Directory.Build.props value regardless of what the version step resolved, which is
            # the other half of the "nuget.org is stuck on 2.0.0" bug. The verify step below is
            # what catches a regression of this line.
            dotnet pack $project.Path -c Release --no-restore -o ./nupkgs -p:CI=true -p:Version=${{ steps.version.outputs.PACKAGE_VERSION }} @extraArgs
            if ($LASTEXITCODE -ne 0) { throw "dotnet pack failed for $($project.Path) with exit code $LASTEXITCODE" }
          }

      - name: List .nupkg contents
        shell: pwsh
        run: |
          # Full content listing in the job log. Public versions can be unlisted but never
          # deleted, so this is the last human-reviewable checkpoint before anything is pushed.
          $packages = Get-ChildItem ./nupkgs -Filter *.nupkg | Sort-Object Name
          if ($packages.Count -ne 5) {
            throw "Expected 5 packages, found $($packages.Count)"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($pkg in $packages) {
            Write-Host ""
            Write-Host "=============================================================="
            Write-Host "$($pkg.Name)  ($([math]::Round($pkg.Length / 1KB)) KB)"
            Write-Host "=============================================================="
            $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
            try {
              foreach ($entry in ($zip.Entries | Sort-Object FullName)) {
                Write-Host ("  {0,10}  {1}" -f $entry.Length, $entry.FullName)
              }
            } finally {
              $zip.Dispose()
            }
          }

      - name: Verify packaged assets
        shell: pwsh
        run: |
          $expectedVersion = "${{ steps.version.outputs.PACKAGE_VERSION }}"
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          # A styled-component package that ships without its stylesheet is unrecoverable in
          # public - it can only be unlisted, never replaced. Gate the push on the CSS, the
          # NOTICE (Apache-2.0 section 4(d)) and the readme actually being inside the archives.
          $required = @{
            'TrBlazeUI.Components'      = @('staticwebassets/trblazeui.css', 'NOTICE', 'README.md')
            'TrBlazeUI.Primitives'      = @('NOTICE', 'README.md')
            'TrBlazeUI.Icons.Lucide'    = @('NOTICE', 'README.md')
            'TrBlazeUI.Icons.Heroicons' = @('NOTICE', 'README.md')
            'TrBlazeUI.Icons.Feather'   = @('NOTICE', 'README.md')
          }

          $failures = @()
          foreach ($id in $required.Keys) {
            $path = "./nupkgs/$id.$expectedVersion.nupkg"
            if (-not (Test-Path $path)) {
              $failures += "$id : expected package $id.$expectedVersion.nupkg not found (version mismatch?)"
              continue
            }
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $path))
            try {
              $entries = $zip.Entries | ForEach-Object { $_.FullName }
              foreach ($needed in $required[$id]) {
                $match = $entries | Where-Object { $_ -eq $needed }
                if (-not $match) {
                  $failures += "$id : MISSING '$needed'"
                } else {
                  Write-Host "$id : OK '$needed'"
                }
              }
              # A doubled separator (e.g. 'buildTransitive//x.targets') silently breaks NuGet's
              # convention-based imports; it has shipped before, so fail rather than warn.
              foreach ($entry in $entries) {
                if ($entry -match '//') { $failures += "$id : malformed entry path '$entry'" }
              }
            } finally {
              $zip.Dispose()
            }
          }

          if ($failures.Count -gt 0) {
            Write-Host ""
            Write-Host "Package verification FAILED:"
            $failures | ForEach-Object { Write-Host "  $_" }
            throw "Refusing to publish - see failures above"
          }
          Write-Host ""
          Write-Host "All five packages verified at version $expectedVersion."

      - name: Dry run complete - NOTHING WAS PUBLISHED
        if: ${{ !startsWith(inputs.mode, 'publish') }}
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.PACKAGE_VERSION }}"
          # ::warning:: surfaces in the run summary UI. A plain Write-Host does not, which is how a
          # dry run ends up looking exactly like a successful publish (2026-08-31).
          Write-Host "::warning title=DRY RUN - nothing was published::Packages were built and verified at $ver but NOT pushed to nuget.org. Re-run this workflow and choose mode = publish."
          @(
            "# :warning: DRY RUN - nothing was published"
            ""
            "Packages were built and verified at **$ver**, then **discarded**."
            "nuget.org is unchanged."
            ""
            "To actually publish: run this workflow again and set **mode = `publish`**."
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # ---------------------------------------------------------------------------------------
      # Everything below this line runs ONLY when mode = publish.
      # ---------------------------------------------------------------------------------------

      - name: NuGet login (Trusted Publishing / OIDC)
        id: login
        if: ${{ startsWith(inputs.mode, 'publish') }}
        uses: NuGet/login@v1
        with:
          # secrets.NUGET_USER is the nuget.org profile name that owns the trusted publishing
          # policy - it is an identity, not a credential. The temporary API key this returns is
          # valid for roughly one hour, which comfortably covers all five pushes below, so this
          # runs immediately before the push step rather than earlier in the job.
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to nuget.org
        if: ${{ startsWith(inputs.mode, 'publish') }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.PACKAGE_VERSION }}"

          # Dependency order matters on a public feed. nuget.org runs asynchronous validation
          # after a push, and a package cannot restore publicly until its dependencies have
          # validated. Components depends on BOTH Primitives and Icons.Lucide, so it goes last.
          # --skip-duplicate makes the whole sequence safely re-runnable: if a later push loses a
          # validation race, re-running the workflow no-ops the packages that already landed.
          $pushOrder = @(
            'TrBlazeUI.Primitives',
            'TrBlazeUI.Icons.Lucide',
            'TrBlazeUI.Icons.Heroicons',
            'TrBlazeUI.Icons.Feather',
            'TrBlazeUI.Components'
          )

          foreach ($id in $pushOrder) {
            $pkg = "./nupkgs/$id.$version.nupkg"
            Write-Host ""
            Write-Host "Pushing $id $version..."
            dotnet nuget push $pkg `
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} `
              --source ${{ env.NUGET_ORG_SOURCE }} `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Failed to push $id with exit code $LASTEXITCODE" }
          }

          Write-Host ""
          Write-Host "All five packages pushed at version $version."
          Write-Host "nuget.org validation and indexing typically completes within 15 minutes."

      - name: Confirm the version is live on nuget.org
        if: ${{ startsWith(inputs.mode, 'publish') }}
        shell: pwsh
        run: |
          # `dotnet nuget push` exiting 0 only means nuget.org ACCEPTED the upload. With
          # --skip-duplicate it also exits 0 when it did nothing at all. Neither proves the
          # version is actually available, so poll the registration index until it appears.
          # Without this, "the workflow was green" is not evidence that anything shipped -
          # which is exactly how nuget.org sat at 2.0.0 from 8/9/2026 while runs looked fine.
          $version = "${{ steps.version.outputs.PACKAGE_VERSION }}"
          $ids = @('TrBlazeUI.Primitives','TrBlazeUI.Icons.Lucide','TrBlazeUI.Icons.Heroicons',
                   'TrBlazeUI.Icons.Feather','TrBlazeUI.Components')
          $deadline = (Get-Date).AddMinutes(20)
          $pending  = [System.Collections.ArrayList]::new($ids)
          $found    = @{}

          while ($pending.Count -gt 0 -and (Get-Date) -lt $deadline) {
            foreach ($id in @($pending)) {
              $url = "https://api.nuget.org/v3-flatcontainer/$($id.ToLower())/index.json"
              try {
                $resp = Invoke-RestMethod -Uri $url -ErrorAction Stop
                if ($resp.versions -contains $version) {
                  Write-Host "LIVE  $id $version"
                  $found[$id] = $true
                  $pending.Remove($id)
                }
              } catch {
                # 404 simply means nothing published yet for this id; keep waiting.
              }
            }
            if ($pending.Count -gt 0) {
              Write-Host "waiting for: $($pending -join ', ')  (validation can take ~15 min)"
              Start-Sleep -Seconds 30
            }
          }

          $liveList = ($ids | Where-Object { $found[$_] } | ForEach-Object { "- ``$_`` **$version** :white_check_mark:" }) -join "`n"
          if ($pending.Count -gt 0) {
            $missing = ($pending | ForEach-Object { "- ``$_`` **$version** :x: not visible" }) -join "`n"
            @("# :x: Publish INCOMPLETE - $version", "", $liveList, $missing, "",
              "Some packages were pushed but are not listed after 20 minutes. This may still be nuget.org validation lag - re-check the profile before re-running.")  |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            throw "Pushed, but these are not live on nuget.org after 20 minutes: $($pending -join ', ')"
          }

          @("# :rocket: Published to nuget.org - $version", "", $liveList, "",
            "All five packages are live and restorable.") |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "All five packages confirmed live on nuget.org at $version."
