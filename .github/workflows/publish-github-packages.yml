name: Build and Publish NuGet Packages

on:
  push:
    branches:
      - main
  release:
    types: [published]

env:
  DOTNET_VERSION: '10.0.x'
  NUGET_SOURCE: 'https://nuget.pkg.github.com/techierathore/index.json'

jobs:
  build-and-publish:
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for version context

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify .NET SDK
        run: dotnet --version

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          # The tag -> version rule lives in scripts/TagVersion.ps1 and is shared with
          # publish-nuget.yml. It used to be a private copy in each workflow, and the copies had
          # drifted: this one stripped a single leading 'v' and nothing else, so the tag 'c2.0.5'
          # (a stray letter where 'v' was meant) failed the 2.0.5 release on 2026-09-12 AFTER the
          # GitHub Release had been published - which can only be undone by deleting the release
          # and its tag. See docs/CI-Issues.md CI-001. Any non-digit prefix is now normalised
          # with a ::warning:: naming the version that ships; a tag holding no version at all
          # still fails, with a message that says how to recover.
          . ./scripts/TagVersion.ps1

          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
            $ver = ConvertTo-PackageVersion -Tag $tag -Source "release tag '$tag'"
            Write-Host "Release tag: $tag -> version: $ver"
          } else {
            # Read the base version from Directory.Build.props and suffix the CI pre-release
            # stem. The base goes through the same rule so a broken props value fails here with
            # a usable message rather than inside dotnet pack.
            [xml]$props = Get-Content "Directory.Build.props"
            $base = ($props.Project.PropertyGroup.Version | Where-Object { $_ }) -as [string]
            $base = ConvertTo-PackageVersion -Tag $base -Source "the <Version> in Directory.Build.props" `
                      -Advice "To recover: fix <Version> in Directory.Build.props (see RELEASE.md)."
            $ver = "$base-ci.${{ github.run_number }}"
            Write-Host "CI build: base=$base -> version: $ver"
          }

          Write-Host "PACKAGE_VERSION=$ver"
          echo "PACKAGE_VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Add GitHub Packages source
        shell: pwsh
        run: |
          # 'remove source' exits 1 when the source is absent. Under GitHub's pwsh
          # ($ErrorActionPreference='stop' + PS 7.4 PSNativeCommandUseErrorActionPreference)
          # that non-zero exit aborts the step, so opt out around the tolerated call.
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet nuget remove source TrBlazeUI 2>&1 | Out-Null
          dotnet nuget add source ${{ env.NUGET_SOURCE }} --name TrBlazeUI --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text
          if ($LASTEXITCODE -ne 0) { throw "dotnet nuget add source failed with exit code $LASTEXITCODE" }

      - name: Restore dependencies
        run: dotnet restore TrBlazeUI.sln

      - name: Build solution
        run: dotnet build TrBlazeUI.sln -c Release --no-restore -p:CI=true -p:Version=${{ steps.version.outputs.PACKAGE_VERSION }}

      - name: Pack NuGet packages
        shell: pwsh
        run: |
          # Pack into a clean directory. The repo tracks stale .nupkg artifacts under
          # ./nupkgs, and the verify/publish steps glob whatever is there - without this
          # the checked-out packages get verified and pushed alongside the fresh ones.
          if (Test-Path ./nupkgs) { Remove-Item ./nupkgs -Recurse -Force }
          New-Item -ItemType Directory -Path ./nupkgs | Out-Null

          # NoWarn is applied per project, NOT as a blanket -p:NoWarn: an MSBuild global
          # property overrides project-level <NoWarn>, which would silently strip e.g.
          # Primitives' CA1716 suppression and fail that pack instead.
          #
          # Components needs NU5104 ("a stable release should not have a prerelease
          # dependency"): its HtmlSanitizer 9.1.949-beta pin is a deliberate security choice
          # (CVE-2026-54570 / REQ-NFR-003), so the warning is expected rather than a defect.
          # Only stable versions trip it - CI builds are always -ci.N prerelease. Drop this
          # once a stable HtmlSanitizer 9.1.x ships (REQ-FN-009).
          $projects = @(
            @{ Path = "src/TrBlazeUI.Primitives/TrBlazeUI.Primitives.csproj" },
            @{ Path = "src/TrBlazeUI.Components/TrBlazeUI.Components.csproj"; NoWarn = "NU5104" },
            @{ Path = "src/TrBlazeUI.Icons.Lucide/TrBlazeUI.Icons.Lucide.csproj" },
            @{ Path = "src/TrBlazeUI.Icons.Heroicons/TrBlazeUI.Icons.Heroicons.csproj" },
            @{ Path = "src/TrBlazeUI.Icons.Feather/TrBlazeUI.Icons.Feather.csproj" }
          )
          foreach ($project in $projects) {
            Write-Host "Packing $($project.Path)..."
            $extraArgs = @()
            if ($project.NoWarn) { $extraArgs += "-p:NoWarn=$($project.NoWarn)" }
            dotnet pack $project.Path -c Release --no-restore -o ./nupkgs -p:CI=true -p:Version=${{ steps.version.outputs.PACKAGE_VERSION }} @extraArgs
            if ($LASTEXITCODE -ne 0) { throw "dotnet pack failed for $($project.Path) with exit code $LASTEXITCODE" }
          }

      - name: List generated packages
        shell: pwsh
        run: |
          $packages = Get-ChildItem ./nupkgs -Filter *.nupkg -ErrorAction SilentlyContinue
          if (-not $packages -or $packages.Count -eq 0) {
            throw "No .nupkg files found in ./nupkgs - pack step likely failed"
          }
          Write-Host "Generated $($packages.Count) packages:"
          foreach ($pkg in $packages) {
            Write-Host "  $($pkg.Name) ($($pkg.Length) bytes)"
          }

      - name: Verify package versions
        shell: pwsh
        run: |
          $expectedVersion = "${{ steps.version.outputs.PACKAGE_VERSION }}"
          $packages = Get-ChildItem ./nupkgs -Filter *.nupkg
          $mismatched = @()
          foreach ($pkg in $packages) {
            if ($pkg.Name -notlike "*$expectedVersion*") {
              $mismatched += $pkg.Name
            }
          }
          if ($mismatched.Count -gt 0) {
            Write-Host "ERROR: Package version mismatch! Expected version: $expectedVersion"
            foreach ($m in $mismatched) {
              Write-Host "  Mismatched: $m"
            }
            throw "Package version verification failed"
          }
          Write-Host "All $($packages.Count) packages contain expected version: $expectedVersion"

      - name: Publish to GitHub Packages
        shell: pwsh
        run: |
          $packages = Get-ChildItem ./nupkgs -Filter *.nupkg
          foreach ($pkg in $packages) {
            Write-Host "Pushing $($pkg.Name)..."
            dotnet nuget push $pkg.FullName --source TrBlazeUI --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Failed to push $($pkg.Name) with exit code $LASTEXITCODE" }
          }
